[project]
name = "chemdft-evaluation-core"
version = "0.1.0"
license = {text = "Apache-2.0"}
description = "Canonical ChemDFT benchmark schema, freeze, and evaluation primitives"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5", "ir-measures>=0.4,<1"]

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis>=6,<7", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemdft_evaluation_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
