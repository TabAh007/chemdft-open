[project]
name = "chemdft-reconstruction-evaluation"
version = "0.1.0"
license = {text = "Apache-2.0"}
description = "Offline experimental evaluation harness for molecular image reconstruction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.1.3",
  "Pillow==12.3.0",
  "rdkit==2025.9.1",
]

[project.optional-dependencies]
decimer = ["decimer==2.8.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
chemdft-reconstruction-evaluate = "chemdft_reconstruction.cli:main"
chemdft-reconstruction-prepare-models = "chemdft_reconstruction.prepare_models:main"
chemdft-reconstruction-build-dataset = "chemdft_reconstruction.dataset:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemdft_reconstruction"]
