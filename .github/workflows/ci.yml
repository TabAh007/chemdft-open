name: CI

# GitHub Actions is NOT the merge gate (DECISIONS.md, 2026-11-09): scripts/local-gate is. This workflow only runs
# when someone starts it by hand (Actions tab -> Run workflow, or `gh workflow run CI`) or pushes a branch named
# `ci/<anything>`. It never runs on pull requests, on main, or on ordinary feature branches. Docs-only pushes to a
# `ci/*` branch are ignored. There are no scheduled workflows.
on:
  workflow_dispatch:
  push:
    branches: ["ci/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"

permissions:
  contents: read

# A newer run of the same ref replaces an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # `pnpm lint` also runs Ruff and `pnpm schemas:check` runs the Python
      # contract generator, so the web job needs the API environment too.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project services/api --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm schemas:check
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm build

  # The backend suite is split over four runners by test file (round robin over the sorted file list), so
  # the union is exactly the former single run: same files, same deselect list, nothing dropped.
  # The aggregate job below keeps the required check name `api`.
  api-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project services/api --frozen
      # Pinned isolated workers: PySCF 2.14.0 and the experimental-spectra worker
      # (the cross-project isolation tests need it). Native launches stay behind
      # the test suite's own native guard; no live AI or cloud calls.
      - run: uv sync --project services/scientific-worker --frozen
      - run: uv sync --project services/spectra-worker --frozen
      - run: uv run --project services/api ruff check .
        if: matrix.shard == 1
      - name: pytest shard ${{ matrix.shard }}/4
        working-directory: services/api
        run: |
          mapfile -t deselect < <(grep -v '^\s*#' ../../.github/ci-local-only-tests.txt | sed '/^\s*$/d; s/^/--deselect=tests\//')
          # shellcheck disable=SC2012
          mapfile -t files < <(ls tests/test_*.py | sort | awk -v shard=${{ matrix.shard }} '(NR-1)%4==shard-1')
          echo "shard ${{ matrix.shard }}: ${#files[@]} files"
          uv run pytest -p no:cacheprovider "${deselect[@]}" "${files[@]}"

  api:
    needs: api-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every backend shard passed
        run: test "${{ needs.api-shard.result }}" = "success"
