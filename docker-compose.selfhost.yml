# ChemDFT self-hosting: optional local Postgres only (see docs/SELF_HOSTING.md).
# Local use only. The password below is a throwaway development value: change it for anything but a laptop.
# Not exercised against ChemDFT (NOT RUN: Docker was unavailable when 0.0.52 was prepared) (SQLite is the tested path).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chemdft
      POSTGRES_PASSWORD: chemdft
      POSTGRES_DB: chemdft
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chemdft-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemdft -d chemdft"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  chemdft-pgdata:
