packages:
  - "apps/*"
  - "packages/*"

overrides:
  ketcher-core: 3.12.0

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - icu-minify@4.14.3
  - next-intl-swc-plugin-extractor@4.14.3
  - next-intl@4.14.3
  - use-intl@4.14.3
